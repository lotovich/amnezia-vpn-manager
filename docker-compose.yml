services:
  amnezia-vpn:
    build: .
    container_name: amnezia-vpn
    restart: unless-stopped

    # Required capabilities for VPN
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

    # Required for userspace WireGuard
    devices:
      - /dev/net/tun:/dev/net/tun

    # Allow sysctls for IP forwarding.
    # src_valid_mark must stay 0: with 1 the reverse-path check uses the
    # TPROXY fwmark, hits the "local default" table and drops every client
    # packet as a martian source (cascade mode).
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=0

    ports:
      # VPN port - UDP
      - "${VPN_PORT:-51820}:${VPN_PORT:-51820}/udp"

    volumes:
      # Persistent data (database)
      - vpn_data:/data
      # WireGuard configs
      - vpn_config:/etc/amneziawg

    env_file:
      - .env

    environment:
      - TZ=UTC

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  vpn_data:
    name: amnezia_vpn_data
  vpn_config:
    name: amnezia_vpn_config
